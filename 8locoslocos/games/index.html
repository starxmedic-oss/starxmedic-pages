e="--art-from:#e29349;--art-to:#a35a1c">J♦</span><span class="games-module__UynK3G__wildCard" style="--art-from:#5fae7b;--art-to:#2f6b48">2♣</span></span></div><span class="modes-module__eiIUMq__tagline games-module__UynK3G__tileTagline">Take no hearts</span><h2 class="modes-module__eiIUMq__modeName games-module__UynK3G__tileTitle">Hearts<!-- --> <span class="games-module__UynK3G__tileSubtitle">the evasion game</span></h2><span class="modes-module__eiIUMq__facts games-module__UynK3G__tileFacts"><span class="modes-module__eiIUMq__fact">4 players</span><span class="modes-module__eiIUMq__fact">pass · trick · evade</span><span class="modes-module__eiIUMq__fact">solo or friends</span></span><p class="modes-module__eiIUMq__description games-module__UynK3G__tileDescription">Dodge every heart, duck the Black Lady, and stick someone else with the points. Rotating passes, secret picks, one very sharp queen.</p></button></div><div class="games-module__UynK3G__tileWrap" role="listitem"><button type="button" class="howto-module__l6fPaa__trigger howto-module__l6fPaa__chip games-module__UynK3G__tileHelp" data-testid="how-to-play-gin" aria-label="Cómo jugar Gin"><span aria-hidden="true">?</span></button><button type="button" aria-disabled="false" data-shelved="false" data-testid="game-gin" class="modes-module__eiIUMq__tile games-module__UynK3G__tile" style="--tile-accent:#5f9e6e;--tile-accent-soft:#5f9e6e44;--tile-shade:#2e5940"><div class="games-module__UynK3G__tileArt"><span class="modes-module__eiIUMq__preview" aria-hidden="true"><span class="games-module__UynK3G__wildCard" style="--art-from:#5fae7b;--art-to:#2f6b48">7♠</span><span class="games-module__UynK3G__wildCard" style="--art-from:#c94b40;--art-to:#8a2f28">K♥</span><span class="games-module__UynK3G__fanCard">A♣</span></span></div><span class="modes-module__eiIUMq__tagline games-module__UynK3G__tileTagline">Meld, knock, win the night</span><h2 class="modes-module__eiIUMq__modeName games-module__UynK3G__tileTitle">Gin<!-- -
